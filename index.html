<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scent For You - Perfume Advisor</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #1a1a1a;
            --accent: #bda370;
            --bg: #f9f9f9;
            --card-bg: #ffffff;
            --text: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.03);
        }

        h1 {
            text-align: center;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 30px;
            color: var(--primary);
            text-transform: uppercase;
        }

        h1 span {
            color: var(--accent);
            font-weight: 600;
        }

        .step-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 30px;
        }

        .option-btn {
            background: #fff;
            border: 2px solid #eee;
            padding: 15px 10px;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .option-btn i {
            display: block;
            font-size: 1.6rem;
            margin-bottom: 8px;
            color: #ccc;
            transition: color 0.3s ease;
        }

        .option-btn:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .option-btn.active {
            border-color: var(--primary);
            background: var(--primary);
            color: #fff;
        }

        .option-btn.active i {
            color: var(--accent);
        }

        .option-btn.active.female-active {
            border-color: #d4a5b8;
            background: #4a3740;
        }
        .option-btn.active.female-active i {
            color: #d4a5b8;
        }

        .hidden {
            display: none;
        }

        #result-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }

        .perfume-card {
            background: #fff;
            border: 1px solid #eee;
            border-left: 5px solid var(--accent);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .perfume-brand {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            font-weight: 600;
        }

        .perfume-name {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--primary);
            margin: 5px 0 10px 0;
        }

        .perfume-desc {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .perfume-notes {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .note-tag {
            background: #f0f0f0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #555;
        }

        @media (max-width: 600px) {
            .container { padding: 20px; margin: 10px auto; }
            .options-grid { grid-template-columns: 1fr 1fr 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Scent <span>For You</span></h1>

        <div id="step-gender">
            <div class="step-title"><i class="fa-solid fa-venus-mars"></i> Select Your Gender</div>
            <div class="options-grid" style="grid-template-columns: 1fr 1fr;">
                <button class="option-btn" onclick="selectGender('male')">
                    <i class="fa-solid fa-mars"></i>Male
                </button>
                <button class="option-btn" onclick="selectGender('female')">
                    <i class="fa-solid fa-venus"></i>Female
                </button>
            </div>
        </div>

        <div id="step-age" class="hidden">
            <div class="step-title"><i class="fa-solid fa-cake-candles"></i> Select Your Age Range</div>
            <div class="options-grid" id="age-buttons-container">
                </div>
        </div>

        <div id="step-environment" class="hidden">
            <div class="step-title"><i class="fa-solid fa-compass"></i> Select Atmosphere / Occasion</div>
            <div class="options-grid" id="env-buttons-container">
                </div>
        </div>

        <div id="result-section" class="hidden">
            <div class="step-title" style="color: var(--primary);"><i class="fa-solid fa-wand-magic-sparkles"></i> Recommendations For You</div>
            <div id="perfume-results"></div>
        </div>
    </div>

    <script>
        let selections = { gender: null, age: null, env: null };

        // PARFÜM DATA GRUPLARI (Yaş grupları otomatik eşleşecek)
        const database = {
            male: {
                young: { // 10-20
                    school: [{ brand: "Zara", name: "Seoul", desc: "Light, fresh, tangerine and marine notes. Perfect for daily school life.", notes: ["Marine Notes", "Tangerine", "Amber"] }],
                    daily: [{ brand: "Nautica", name: "Voyage", desc: "Legendary budget-friendly summer freshness featuring green apple.", notes: ["Green Apple", "Water Lily", "Cedarwood"] }],
                    beach: [{ brand: "Zara", name: "Lisboa", desc: "Zesty lemon breeze, ideal for cooling down at the beach.", notes: ["Lemon", "Jasmine", "Cedarwood"] }],
                    special: [{ brand: "Versace", name: "Eros EDT", desc: "Energetic mint-apple vibe that stands out beautifully in any crowd.", notes: ["Mint", "Green Apple", "Vanilla"] }]
                },
                college: { // 20-25
                    school: [{ brand: "YSL", name: "Y EDP", desc: "Modern, clean, apple and woody notes. Lasts all day in lecture halls.", notes: ["Apple", "Sage", "Cedarwood"] }],
                    work: [{ brand: "Prada", name: "L'Homme", desc: "The ultimate clean office scent. Luxurious soapy freshness with elegant iris.", notes: ["Iris", "Neroli", "Amber"] }],
                    daily: [{ brand: "Dior", name: "Sauvage EDT", desc: "Intense bergamot and pepper combo. A wildly popular signature daily scent.", notes: ["Calabrian Bergamot", "Sichuan Pepper", "Ambroxan"] }],
                    beach: [{ brand: "Kenzo", name: "Homme Intense", desc: "Sea salt and fig tree notes, offering a tropical woody summer vibe.", notes: ["Sea Salt", "Fig", "Sandalwood"] }],
                    special: [{ brand: "Xerjoff", name: "Naxos", desc: "Perfect harmony of honey, tobacco, and vanilla. Outstanding premium performance.", notes: ["Honey", "Tobacco Leaf", "Vanilla"] }]
                },
                adult: { // 25-50
                    work: [{ brand: "Terre d'Hermes", name: "Hermes EDT", desc: "Earthy flint and bitter orange, highly praised in professional business life.", notes: ["Orange", "Flint", "Cedar", "Vetiver"] }],
                    daily: [{ brand: "Creed", name: "Aventus", desc: "Legendary blend of rich pineapple and smoky birch notes. Absolute daily luxury.", notes: ["Pineapple", "Birch", "Musk"] }],
                    beach: [{ brand: "Armani", name: "Acqua Di Gio Parfum", desc: "Deep marine essence with a touch of rich incense, fantastic for coastal sunsets.", notes: ["Marine Notes", "Rosemary", "Incense"] }],
                    special: [{ brand: "Tom Ford", name: "Noir Extreme", desc: "Seductive cardamom and exotic kulfi ice cream notes. Great for date nights.", notes: ["Kulfi", "Cardamom", "Vanilla"] }]
                },
                mature: { // 50-90
                    work: [{ brand: "Chanel", name: "Bleu de Chanel Parfum", desc: "Deep, rich, majestic woody trail layered with smooth sandalwood for supreme status.", notes: ["Sandalwood", "Citrus", "Cedar"] }],
                    daily: [{ brand: "Guerlain", name: "Vetiver", desc: "The gold standard of masculine elegance. Fresh, earthy, clean, and completely timeless.", notes: ["Vetiver", "Tobacco", "Bergamot"] }],
                    beach: [{ brand: "Tom Ford", name: "Costa Azzurra", desc: "A luxurious coastal escape blending salty sea air with rich, aromatic evergreen oaks.", notes: ["Driftwood", "Sea Salt", "Oud"] }],
                    special: [{ brand: "Roja Parfums", name: "Elysium Pour Homme", desc: "Ultra-premium, sophisticated elite blend of fresh citruses, ambergris, and leathery tones.", notes: ["Grapefruit", "Ambergris", "Leather"] }]
                }
            },
            female: {
                young: { // 10-20
                    school: [{ brand: "Zara", name: "Wonder Rose", desc: "Joyful, sweet pear and red berry blend that fits nicely into school hours.", notes: ["Pear", "Red Berries", "Vanilla"] }],
                    daily: [{ brand: "Zara", name: "Orchid", desc: "Fresh orchid and blackcurrant notes, providing a clean, airy feel.", notes: ["Orchid", "Bergamot", "Blackcurrant"] }],
                    beach: [{ brand: "Zara", name: "Femme", desc: "Peony and vanilla blend with soft, powdery sunscreen undertones.", notes: ["Peony", "Vanilla", "Musk"] }],
                    special: [{ brand: "Aquolina", name: "Pink Sugar", desc: "Playful cotton candy and caramel theme, highly cheerful youth fragrance.", notes: ["Cotton Candy", "Caramel", "Strawberry"] }]
                },
                college: { // 20-25
                    school: [{ brand: "Chanel", name: "Chance Eau Tendre", desc: "High-class, crisp, and sophisticated quince and jasmine for university women.", notes: ["Quince", "Grapefruit", "Jasmine"] }],
                    work: [{ brand: "Lancome", name: "Idole", desc: "Spotless clean rose and white musk. Very bright and professional for office wear.", notes: ["Rose", "Pear", "White Musk"] }],
                    daily: [{ brand: "Ariana Grande", name: "Cloud", desc: "Soft, whipped cream and coconut notes. A highly viral and cozy everyday scent.", notes: ["Whipped Cream", "Coconut", "Praline"] }],
                    beach: [{ brand: "Sol de Janeiro", name: "Cheirosa 62", desc: "Pistachio and salted caramel perfection, radiating warm beach energy.", notes: ["Pistachio", "Salted Caramel", "Vanilla"] }],
                    special: [{ brand: "Carolina Herrera", name: "Good Girl", desc: "Iconic stiletto bottle featuring rich cocoa and coffee. Captivating night-out choice.", notes: ["Almond", "Coffee", "Cocoa"] }]
                },
                adult: { // 25-50
                    work: [{ brand: "Narciso Rodriguez", name: "For Her Pure Musc", desc: "Noble musk that exudes modern corporate confidence and empowerment.", notes: ["Musk", "White Flowers", "Cashmeran"] }],
                    daily: [{ brand: "Chanel", name: "Coco Mademoiselle", desc: "Timeless orange and rich patchouli blend. Highly elegant and wealthy aura.", notes: ["Orange", "Patchouli", "Turkish Rose"] }],
                    beach: [{ brand: "Estee Lauder", name: "Bronze Goddess", desc: "A luxury beach classic filled with rich coconut, tiare flower, and glowing warmth.", notes: ["Coconut", "Tiare Flower", "Amber"] }],
                    special: [{ brand: "Parfums de Marly", name: "Delina", desc: "The queen of niche. Heavenly Turkish rose mixed with exotic lychee and rhubarb.", notes: ["Turkish Rose", "Lychee", "Rhabarb", "Vanilla"] }]
                },
                mature: { // 50-90
                    work: [{ brand: "Dior", name: "J'adore EDP", desc: "A glorious, majestic bouquet of ylang-ylang, rose, and jasmine. Pure classic grace.", notes: ["Ylang-Ylang", "Damask Rose", "Jasmine"] }],
                    daily: [{ brand: "Hermes", name: "Eau des Merveilles", desc: "An enchanting, warm woody-amber scent without dominant flowers. Pure poetic luxury.", notes: ["Ambergris", "Elemi Resin", "Orange"] }],
                    beach: [{ brand: "Tom Ford", name: "Soleil Blanc", desc: "Luxe coco de mer and sultry ylang-ylang. Exudes high-end resort private island vibe.", notes: ["Coconut", "Ylang-Ylang", "Cardamom"] }],
                    special: [{ brand: "Maison Francis Kurkdjian", name: "Baccarat Rouge 540", desc: "Exquisite saffron and amberwood. A historic luxury scent that commands total respect.", notes: ["Saffron", "Jasmine", "Amberwood"] }]
                }
            }
        };

        // YAŞ BUTONLARINI 5'ER 5'ER DOĞURAN FONKSİYON (10'dan 90'a)
        function generateAgeButtons() {
            const container = document.getElementById('age-buttons-container');
            container.innerHTML = '';
            
            // 10-15 ve 15-20 elle eklensin, sonrakiler 5'er artsın
            const ageRanges = ['10-15', '15-20'];
            for(let i = 20; i < 90; i += 5) {
                ageRanges.push(`${i}-${i+5}`);
            }

            ageRanges.forEach(range => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = range;
                btn.onclick = (e) => selectAge(range, e);
                container.appendChild(btn);
            });
        }

        function selectGender(gender) {
            selections.gender = gender;
            const buttons = document.querySelectorAll('#step-gender .option-btn');
            buttons.forEach(btn => btn.classList.remove('active', 'female-active'));
            
            if (gender === 'female') {
                event.currentTarget.classList.add('active', 'female-active');
            } else {
                event.currentTarget.classList.add('active');
            }
            generateAgeButtons();
            document.getElementById('step-age').classList.remove('hidden');
            resetFromStep('age');
        }

        function selectAge(age, e) {
            selections.age = age;
            const buttons = document.querySelectorAll('#step-age .option-btn');
            buttons.forEach(btn => btn.classList.remove('active', 'female-active'));
            
            if (selections.gender === 'female') {
                e.currentTarget.classList.add('active', 'female-active');
            } else {
                e.currentTarget.classList.add('active');
            }
            buildEnvironmentButtons(age);
            document.getElementById('step-environment').classList.remove('hidden');
            resetFromStep('env');
        }

        function buildEnvironmentButtons(age) {
            const container = document.getElementById('env-buttons-container');
            container.innerHTML = '';

            const allEnvs = {
                school: { text: "School", icon: "fa-solid fa-graduation-cap" },
                work: { text: "Work", icon: "fa-solid fa-briefcase" },
                daily: { text: "Daily", icon: "fa-solid fa-house-user" },
                beach: { text: "Beach / Coast", icon: "fa-solid fa-umbrella-beach" },
                special: { text: "Special Night", icon: "fa-solid fa-champagne-glasses" }
            };

            let activeEnvs = [];

            // Dinamik Mekan Dağılımı Kuralları:
            if (age === '10-15' || age === '15-20') {
                activeEnvs = ['school', 'daily', 'beach', 'special'];
            } else if (age === '20-25') {
                activeEnvs = ['school', 'work', 'daily', 'beach', 'special'];
            } else {
                // 25 yaşından 90 yaşına kadar olan tüm gruplarda sadece iş ve diğerleri gelir
                activeEnvs = ['work', 'daily', 'beach', 'special'];
            }

            activeEnvs.forEach(envKey => {
                const envInfo = allEnvs[envKey];
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<i class="${envInfo.icon}"></i>${envInfo.text}`;
                btn.onclick = (e) => selectEnvironment(envKey, e);
                container.appendChild(btn);
            });
        }

        function selectEnvironment(env, e) {
            selections.env = env;
            const buttons = document.querySelectorAll('#step-environment .option-btn');
            buttons.forEach(btn => btn.classList.remove('active', 'female-active'));
            
            if (selections.gender === 'female') {
                e.currentTarget.classList.add('active', 'female-active');
            } else {
                e.currentTarget.classList.add('active');
            }
            showResults();
        }

        function showResults() {
            const resultSection = document.getElementById('result-section');
            const resultsContainer = document.getElementById('perfume-results');
            resultsContainer.innerHTML = '';

            // Seçilen yaş aralığına göre veritabanı kümesini haritalandır
            let ageGroup = 'adult';
            if (selections.age === '10-15' || selections.age === '15-20') ageGroup = 'young';
            else if (selections.age === '20-25') ageGroup = 'college';
            else {
                // Yaş aralığının ilk sayısını çek (Örn: "55-60" -> 55)
                let firstAge = parseInt(selections.age.split('-')[0]);
                if (firstAge >= 50) ageGroup = 'mature';
            }

            const perfumes = database[selections.gender]?.[ageGroup]?.[selections.env] || [];

            if (perfumes.length === 0) {
                resultsContainer.innerHTML = '<p style="color: #999;">No matching perfumes found.</p>';
            } else {
                perfumes.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'perfume-card';
                    if(selections.gender === 'female') {
                        card.style.borderLeftColor = '#d4a5b8';
                    }
                    let notesHtml = p.notes.map(n => `<span class="note-tag">${n}</span>`).join('');
                    card.innerHTML = `
                        <div class="perfume-brand">${p.brand}</div>
                        <div class="perfume-name">${p.name}</div>
                        <div class="perfume-desc">${p.desc}</div>
                        <div class="perfume-notes">${notesHtml}</div>
                    `;
                    resultsContainer.appendChild(card);
                });
            }
            resultSection.classList.remove('hidden');
            resultSection.scrollIntoView({ behavior: 'smooth' });
        }

        function resetFromStep(step) {
            if (step === 'age') {
                document.getElementById('step-environment').classList.add('hidden');
                selections.age = null; selections.env = null;
            }
            if (step === 'env') { selections.env = null; }
            document.getElementById('result-section').classList.add('hidden');
        }
    </script>
</body>
</html>

<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --primary: #1a1a1a;
            --accent: #bda370;
            --bg: #f9f9f9;
            --card-bg: #ffffff;
            --text: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.03);
        }

        h1 {
            text-align: center;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 30px;
            color: var(--primary);
            text-transform: uppercase;
        }

        h1 span {
            color: var(--accent);
            font-weight: 600;
        }

        .step-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 12px;
            margin-bottom: 30px;
        }

        .option-btn {
            background: #fff;
            border: 2px solid #eee;
            padding: 15px 10px;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .option-btn i {
            display: block;
            font-size: 1.6rem;
            margin-bottom: 8px;
            color: #ccc;
            transition: color 0.3s ease;
        }

        .option-btn:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .option-btn.active {
            border-color: var(--primary);
            background: var(--primary);
            color: #fff;
        }

        .option-btn.active i {
            color: var(--accent);
        }

        .option-btn.active.female-active {
            border-color: #d4a5b8;
            background: #4a3740;
        }
        .option-btn.active.female-active i {
            color: #d4a5b8;
        }

        .hidden {
            display: none;
        }

        #result-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }

        .perfume-card {
            background: #fff;
            border: 1px solid #eee;
            border-left: 5px solid var(--accent);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .perfume-brand {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            font-weight: 600;
        }

        .perfume-name {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--primary);
            margin: 5px 0 10px 0;
        }

        .perfume-desc {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .perfume-notes {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .note-tag {
            background: #f0f0f0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #555;
        }

        @media (max-width: 600px) {
            .container { padding: 20px; margin: 10px auto; }
            .options-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>

        function selectGender(gender) {
            selections.gender = gender;
            const buttons = document.querySelectorAll('#step-gender .option-btn');
            buttons.forEach(btn => btn.classList.remove('active', 'female-active'));
            
            if (gender === 'female') {
                event.currentTarget.classList.add('active', 'female-active');
            } else {
                event.currentTarget.classList.add('active');
            }
            document.getElementById('step-age').classList.remove('hidden');
            resetFromStep('age');
        }

        function selectAge(age, e) {
            selections.age = age;
            const buttons = document.querySelectorAll('#step-age .option-btn');
            buttons.forEach(btn => btn.classList.remove('active', 'female-active'));
            
            if (selections.gender === 'female') {
                e.currentTarget.classList.add('active', 'female-active');
            } else {
                e.currentTarget.classList.add('active');
            }
            buildEnvironmentButtons(age);
            document.getElementById('step-environment').classList.remove('hidden');
            resetFromStep('env');
        }

        function buildEnvironmentButtons(age) {
            const container = document.getElementById('env-buttons-container');
            container.innerHTML = '';

            const allEnvs = {
                school: { text: "School", icon: "fa-solid fa-graduation-cap" },
                work: { text: "Work", icon: "fa-solid fa-briefcase" },
                daily: { text: "Daily", icon: "fa-solid fa-house-user" },
                beach: { text: "Beach / Coast", icon: "fa-solid fa-umbrella-beach" },
                special: { text: "Special Night", icon: "fa-solid fa-champagne-glasses" }
            };

            let activeEnvs = [];

            if (age === '10-15' || age === '15-20') {
                activeEnvs = ['school', 'daily', 'beach', 'special'];
            } else if (age === '20-25') {
                activeEnvs = ['school', 'work', 'daily', 'beach', 'special'];
            } else {
                activeEnvs = ['work', 'daily', 'beach', 'special'];
            }

            activeEnvs.forEach(envKey => {
                const envInfo = allEnvs[envKey];
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<i class="${envInfo.icon}"></i>${envInfo.text}`;
                btn.onclick = (e) => selectEnvironment(envKey, e);
                container.appendChild(btn);
            });
        }

        function selectEnvironment(env, e) {
            selections.env = env;
            const buttons = document.querySelectorAll('#step-environment .option-btn');
            buttons.forEach(btn => btn.classList.remove('active', 'female-active'));
            
            if (selections.gender === 'female') {
                e.currentTarget.classList.add('active', 'female-active');
            } else {
                e.currentTarget.classList.add('active');
            }
            showResults();
        }

        function showResults() {
            const resultSection = document.getElementById('result-section');
            const resultsContainer = document.getElementById('perfume-results');
            resultsContainer.innerHTML = '';

            // Yaş grubunu doğrudan eşle, 50 üzerini tek bir gruba topla
            let targetAge = selections.age;
            let firstAgeNum = parseInt(targetAge.split('-')[0]);
            if (firstAgeNum >= 50) {
                targetAge = "50-90";
            }

            const perfumes = database[selections.gender]?.[targetAge]?.[selections.env] || [];

            if (perfumes.length === 0) {
                resultsContainer.innerHTML = '<p style="color: #999;">No matching perfumes found.</p>';
            } else {
                perfumes.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'perfume-card';
                    if(selections.gender === 'female') {
                        card.style.borderLeftColor = '#d4a5b8';
                    }
                    let notesHtml = p.notes.map(n => `<span class="note-tag">${n}</span>`).join('');
                    card.innerHTML = `
                        <div class="perfume-brand">${p.brand}</div>
                        <div class="perfume-name">${p.name}</div>
                        <div class="perfume-desc">${p.desc}</div>
                        <div class="perfume-notes">${notesHtml}</div>
                    `;
                    resultsContainer.appendChild(card);
                });
            }
            resultSection.classList.remove('hidden');
            resultSection.scrollIntoView({ behavior: 'smooth' });
        }

        function resetFromStep(step) {
            if (step === 'age') {
                document.getElementById('step-environment').classList.add('hidden');
                selections.age = null; selections.env = null;
            }
            if (step === 'env') { selections.env = null; }
            document.getElementById('result-section').classList.add('hidden');
        }
    </script>
</body>
</html>

<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --primary: #111111;
            --accent: #c5a880;
            --bg: #fafafa;
            --card-bg: #ffffff;
            --text: #222222;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.02);
        }

        h1 {
            text-align: center;
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 40px;
            color: var(--primary);
            text-transform: uppercase;
        }

        h1 span {
            color: var(--accent);
            font-weight: 700;
        }

        .step-title {
            font-size: 1rem;
            margin-bottom: 20px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 35px;
        }

        .option-btn {
            background: #ffffff;
            border: 1px solid #e5e5e5;
            padding: 18px 12px;
            border-radius: 16px;
            cursor: pointer;
            text-align: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
        }

        .option-btn i {
            display: block;
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #bbbbbb;
            transition: color 0.25s ease;
        }

        .option-btn:hover {
            border-color: var(--accent);
            background-color: #fdfbf7;
            transform: translateY(-2px);
        }

        .option-btn.active {
            border-color: var(--primary);
            background: var(--primary);
            color: #ffffff;
        }

        .option-btn.active i {
            color: var(--accent);
        }

        .option-btn.active.female-active {
            border-color: #cca4b4;
            background: #3a2d34;
            color: #ffffff;
        }
        
        .option-btn.active.female-active i {
            color: #cca4b4;
        }

        .hidden {
            display: none;
        }

        #result-section {
            margin-top: 45px;
            padding-top: 35px;
            border-top: 2px dashed #eeeeee;
        }

        .perfume-card {
            background: #ffffff;
            border: 1px solid #eaeaea;
            border-left: 6px solid var(--accent);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.01);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .perfume-brand {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .perfume-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .perfume-desc {
            color: #555555;
            font-size: 1rem;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .perfume-notes {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .note-tag {
            background: #f4f4f4;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #444444;
            font-weight: 500;
            border: 1px solid #eaeaea;
        }

        @media (max-width: 600px) {
            .container { padding: 25px; margin: 15px auto; }
            .options-grid { grid-template-columns: repeat(2, 1fr); }
        }

            { gender: "female", group: "extra2", env: "beach", brand: "Jo Malone", name: "Wood Sage & Sea Salt", desc: "Mineral coastal waves clashing into driftwood and aromatic herbal sage bushes.", notes: ["Sea Salt", "Sage", "Ambrette"] },
            { gender: "female", group: "extra2", env: "special", brand: "Kilian", name: "Good Girl Gone Bad Extreme", desc: "Opulent private ball scent highlighting lactonic milk layers over sweet osmanthus bloom.", notes: ["Osmanthus", "Milk Accord", "Tuberose"] },

            // extra3 (60+)
            { gender: "female", group: "extra3", env: "work", brand: "Chanel", name: "No. 19 Poudre", desc: "The ultimate professional soft boundary. Velvety iris powder and crisp green galbanum.", notes: ["Iris Powder", "Galbanum", "White Musk"] },
            { gender: "female", group: "extra3", env: "daily", brand: "Guerlain", name: "L'Heure Bleue", desc: "A historic masterpiece of romantic melancholy. Soft violet dust and powdery anise.", notes: ["Anise", "Violet", "Iris"] },
            { gender: "female", group: "extra3", env: "beach", brand: "Hermes", name: "Un Jardin En Mediterranee", desc: "Strolling through a sea-facing palace yard filled with fresh green fig leaves.", notes: ["Fig Leaf", "Cypress", "Red Cedar"] },
            { gender: "female", group: "extra3", env: "special", brand: "Roja Parfums", name: "51 Pour Femme", desc: "An orchestra of immense luxury. Creamy rich ylang-ylang, deep cashmeran, and vanilla.", notes: ["Ylang-Ylang", "Cashmeran", "Vanilla"] }
        ];

        function handleGender(gender, element) {
            globalState.gender = gender;
            const buttons = document.querySelectorAll('#step-gender .option-btn');
            buttons.forEach(btn => btn.classList.remove('active', 'female-active'));
            
            if (gender === 'female') {
                element.classList.add('active', 'female-active');
            } else {
                element.classList.add('active');
            }
            
            document.getElementById('step-age').classList.remove('hidden');
            wipeState('age');
        }

        function handleAge(age, element) {
            globalState.age = age;
            const buttons = document.querySelectorAll('#step-age .option-btn');
            buttons.forEach(btn => btn.classList.remove('active', 'female-active'));
            
            if (globalState.gender === 'female') {
                element.classList.add('active', 'female-active');
            } else {
                element.classList.add('active');
            }
            
            generateDynamicEnvironments(age);
            document.getElementById('step-environment').classList.remove('hidden');
            wipeState('env');
        }

        function generateDynamicEnvironments(age) {
            const dynamicContainer = document.getElementById('env-buttons-dynamic');
            dynamicContainer.innerHTML = '';

            const environmentDictionary = {
                school: { text: "School / Campus", icon: "fa-solid fa-graduation-cap" },
                work: { text: "Corporate / Work", icon: "fa-solid fa-briefcase" },
                daily: { text: "Casual / Daily", icon: "fa-solid fa-house-user" },
                beach: { text: "Beach / Cruise", icon: "fa-solid fa-umbrella-beach" },
                special: { text: "Special Night", icon: "fa-solid fa-champagne-glasses" }
            };

            let visibleEnvironments = [];
            let checkAge = parseInt(age.split('-')[0]);

            if (checkAge < 20) {
                visibleEnvironments = ['school', 'daily', 'beach', 'special'];
            } else if (checkAge === 20) {
                visibleEnvironments = ['school', 'work', 'daily', 'beach', 'special'];
            } else {
                visibleEnvironments = ['work', 'daily', 'beach', 'special'];
            }

            visibleEnvironments.forEach(key => {
                const data = environmentDictionary[key];
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<i class="${data.icon}"></i>${data.text}`;
                btn.onclick = function() { executeEnvironmentSelection(key, this); };
                dynamicContainer.appendChild(btn);
            });
        }

        function executeEnvironmentSelection(env, element) {
            globalState.environment = env;
            const buttons = document.querySelectorAll('#step-environment .option-btn');
            buttons.forEach(btn => btn.classList.remove('active', 'female-active'));
            
            if (globalState.gender === 'female') {
                element.classList.add('active', 'female-active');
            } else {
                element.classList.add('active');
            }
            renderFinalFormulation();
        }

        function renderFinalFormulation() {
            const outputSection = document.getElementById('result-section');
            const targetContainer = document.getElementById('perfume-results-card');
            targetContainer.innerHTML = '';

            let ageParser = parseInt(globalState.age.split('-')[0]);
            let targetGroup = "teen";

            if (ageParser >= 10 && ageParser < 20) targetGroup = "teen";
            else if (ageParser >= 20 && ageParser < 25) targetGroup = "young";
            else if (ageParser >= 25 && ageParser < 30) targetGroup = "extra4";
            else if (ageParser >= 30 && ageParser < 35) targetGroup = "mid";
            else if (ageParser >= 35 && ageParser < 40) targetGroup = "senior";
            else if (ageParser >= 40 && ageParser < 45) targetGroup = "mature";
            else if (ageParser >= 45 && ageParser < 50) targetGroup = "extra1";
            else if (ageParser >= 50 && ageParser < 60) targetGroup = "extra2";
            else if (ageParser >= 60) targetGroup = "extra3";

            // KESİN ARAMA PROTOKOLÜ
            let finalSelection = MasterDatabase.find(p => p.gender === globalState.gender && p.group === targetGroup && p.env === globalState.environment);

            // GÜVENLİK FİLTRESİ
            if (!finalSelection) {
                finalSelection = MasterDatabase.find(p => p.gender === globalState.gender && p.env === globalState.environment);
            }

            const elementCard = document.createElement('div');
            elementCard.className = 'perfume-card';
            if(globalState.gender === 'female') {
                elementCard.style.borderLeftColor = '#cca4b4';
            }
            
            let structuredNotes = finalSelection.notes.map(n => `<span class="note-tag">${n}</span>`).join('');
            
            elementCard.innerHTML = `
                <div class="perfume-brand">${finalSelection.brand}</div>
                <div class="perfume-name">${finalSelection.name}</div>
                <div class="perfume-desc">${finalSelection.desc}</div>
                <div class="perfume-notes">${structuredNotes}</div>
            `;
            
            targetContainer.appendChild(elementCard);
            outputSection.classList.remove('hidden');
            outputSection.scrollIntoView({ behavior: 'smooth' });
        }

        function wipeState(level) {
            if (level === 'age') {
                document.getElementById('step-environment').classList.add('hidden');
                globalState.age = null; globalState.environment = null;
            }
            if (level === 'env') { globalState.environment = null; }
            document.getElementById('result-section').classList.add('hidden');
        }
    </script>
</body>
</html>

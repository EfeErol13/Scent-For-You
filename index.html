    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #111111;
            --accent: #bda370;
            --bg: #fafafa;
            --card-bg: #ffffff;
            --text: #222222;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: '-apple-system', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        h1 {
            text-align: center;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        h1 span {
            color: var(--accent);
            font-weight: 600;
        }

        .step-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 12px;
            margin-bottom: 30px;
        }

        .option-btn {
            background: #fff;
            border: 2px solid #eee;
            padding: 15px 10px;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .option-btn i {
            display: block;
            font-size: 1.6rem;
            margin-bottom: 8px;
            color: #ccc;
        }

        .option-btn:hover {
            border-color: var(--accent);
        }

        .option-btn.active {
            border-color: var(--primary);
            background: var(--primary);
            color: #fff;
        }

        .option-btn.active.female-active {
            border-color: #cca4b4;
            background: #3a2d34;
            color: #fff;
        }

        .hidden {
            display: none;
        }

        #result-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px dashed #eee;
        }

        .perfume-card {
            background: #fff;
            border: 1px solid #eee;
            border-left: 5px solid var(--accent);
            padding: 25px;
            border-radius: 12px;
        }

        .perfume-brand {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: 600;
        }

        .perfume-name {
            font-size: 1.4rem;
            font-weight: 600;
            margin: 5px 0 10px 0;
        }

        .perfume-desc {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .perfume-notes {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .note-tag {
            background: #f0f0f0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>

            { gender: "female", group: "extra3", env: "work", brand: "Dior", name: "J'adore EDP", desc: "A majestic, historic golden bouquet of rare damask roses, exotic ylang-ylang, and clean jasmine.", notes: ["Ylang-Ylang", "Damask Rose", "Jasmine"] },
            { gender: "female", group: "extra3", env: "daily", brand: "Hermes", name: "Eau des Merveilles", desc: "An enchanting, warm woody-amber summer coast glow that is beautifully free from heavy flowers.", notes: ["Ambergris", "Orange", "Elemi Resin", "Fir Woods"] },
            { gender: "female", group: "extra3", env: "beach", brand: "Hermes", name: "Un Jardin En Mediterranee", desc: "Strolling through royal sea-facing Mediterranean yards filled with green fresh fig leaves.", notes: ["Fig Leaf", "Cypress", "Cedar", "Bergamot"] },
            { gender: "female", group: "extra3", env: "special", brand: "Clive Christian", name: "No. 1 Feminine", desc: "Uncompromising rare luxury. Rare powdery oriental notes blended with rich legacy vanilla extracts.", notes: ["Powdery Notes", "Vanilla", "Ylang-Ylang", "Sandalwood"] }
        ];

        function selectGender(gender, btn) {
            selections.gender = gender;
            document.querySelectorAll('#step-gender .option-btn').forEach(b => b.classList.remove('active', 'female-active'));
            btn.classList.add('active');
            if (gender === 'female') btn.classList.add('female-active');
            document.getElementById('step-age').classList.remove('hidden');
            resetState('age');
        }

        function selectAge(age, btn) {
            selections.age = age;
            document.querySelectorAll('#step-age .option-btn').forEach(b => b.classList.remove('active', 'female-active'));
            btn.classList.add('active');
            if (selections.gender === 'female') btn.classList.add('female-active');
            buildEnvironments(age);
            document.getElementById('step-environment').classList.remove('hidden');
            resetState('env');
        }

        function buildEnvironments(age) {
            const container = document.getElementById('env-container');
            container.innerHTML = '';

            const envs = {
                school: { text: "School", icon: "fa-solid fa-graduation-cap" },
                work: { text: "Work", icon: "fa-solid fa-briefcase" },
                daily: { text: "Daily", icon: "fa-solid fa-house-user" },
                beach: { text: "Beach", icon: "fa-solid fa-umbrella-beach" },
                special: { text: "Special Night", icon: "fa-solid fa-champagne-glasses" }
            };

            let startAge = parseInt(age.split('-')[0]);
            let activeKeys = [];

            if (startAge < 20) activeKeys = ['school', 'daily', 'beach', 'special'];
            else if (startAge === 20) activeKeys = ['school', 'work', 'daily', 'beach', 'special'];
            else activeKeys = ['work', 'daily', 'beach', 'special'];

            activeKeys.forEach(k => {
                const item = envs[k];
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.innerHTML = `<i class="${item.icon}"></i>${item.text}`;
                button.onclick = function() { selectEnvironment(k, this); };
                container.appendChild(button);
            });
        }

        function selectEnvironment(env, btn) {
            selections.env = env;
            document.querySelectorAll('#step-environment .option-btn').forEach(b => b.classList.remove('active', 'female-active'));
            btn.classList.add('active');
            if (selections.gender === 'female') btn.classList.add('female-active');
            calculateResult();
        }

        function calculateResult() {
            const resultSection = document.getElementById('result-section');
            const target = document.getElementById('perfume-result-target');
            target.innerHTML = '';

            let startAge = parseInt(selections.age.split('-')[0]);
            let mappedGroup = "teen";

            if (startAge >= 10 && startAge < 20) mappedGroup = "teen";
            else if (startAge >= 20 && startAge < 25) mappedGroup = "young";
            else if (startAge >= 25 && startAge < 30) mappedGroup = "extra4";
            else if (startAge >= 30 && startAge < 35) mappedGroup = "mid";
            else if (startAge >= 35 && startAge < 40) mappedGroup = "senior";
            else if (startAge >= 40 && startAge < 45) mappedGroup = "mature";
            else if (startAge >= 45 && startAge < 50) mappedGroup = "extra1";
            else if (startAge >= 50 && startAge < 60) mappedGroup = "extra2";
            else if (startAge >= 60) mappedGroup = "extra3";

            let match = perfumePool.find(p => p.gender === selections.gender && p.group === mappedGroup && p.env === selections.env);

            const card = document.createElement('div');
            card.className = 'perfume-card';
            if(selections.gender === 'female') card.style.borderLeftColor = '#cca4b4';
            
            let tags = match.notes.map(n => `<span class="note-tag">${n}</span>`).join('');
            card.innerHTML = `
                <div class="perfume-brand">${match.brand}</div>
                <div class="perfume-name">${match.name}</div>
                <div class="perfume-desc">${match.desc}</div>
                <div class="perfume-notes">${tags}</div>
            `;
            target.appendChild(card);
            
            resultSection.classList.remove('hidden');
            resultSection.scrollIntoView({ behavior: 'smooth' });
        }

        function resetState(step) {
            if (step === 'age') {
                document.getElementById('step-environment').classList.add('hidden');
                selections.age = null; selections.env = null;
            }
            if (step === 'env') { selections.env = null; }
            document.getElementById('result-section').classList.add('hidden');
        }
    </script>
</body>
</html>

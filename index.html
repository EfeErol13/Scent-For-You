<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scent For You - Perfume Advisor</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #1a1a1a;
            --accent: #bda370;
            --bg: #f9f9f9;
            --card-bg: #ffffff;
            --text: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.03);
        }

        h1 {
            text-align: center;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 30px;
            color: var(--primary);
            text-transform: uppercase;
        }

        h1 span {
            color: var(--accent);
            font-weight: 600;
        }

        .step-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 12px;
            margin-bottom: 30px;
        }

        .option-btn {
            background: #fff;
            border: 2px solid #eee;
            padding: 15px 10px;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .option-btn i {
            display: block;
            font-size: 1.6rem;
            margin-bottom: 8px;
            color: #ccc;
            transition: color 0.3s ease;
        }

        .option-btn:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .option-btn.active {
            border-color: var(--primary);
            background: var(--primary);
            color: #fff;
        }

        .option-btn.active i {
            color: var(--accent);
        }

        .option-btn.active.female-active {
            border-color: #d4a5b8;
            background: #4a3740;
        }
        .option-btn.active.female-active i {
            color: #d4a5b8;
        }

        .hidden {
            display: none;
        }

        #result-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }

        .perfume-card {
            background: #fff;
            border: 1px solid #eee;
            border-left: 5px solid var(--accent);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .perfume-brand {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            font-weight: 600;
        }

        .perfume-name {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--primary);
            margin: 5px 0 10px 0;
        }

        .perfume-desc {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .perfume-notes {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .note-tag {
            background: #f0f0f0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #555;
        }

        @media (max-width: 600px) {
            .container { padding: 20px; margin: 10px auto; }
            .options-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Scent <span>For You</span></h1>

        <div id="step-gender">
            <div class="step-title"><i class="fa-solid fa-venus-mars"></i> Select Your Gender</div>
            <div class="options-grid" style="grid-template-columns: 1fr 1fr;">
                <button class="option-btn" onclick="selectGender('male')">
                    <i class="fa-solid fa-mars"></i>Male
                </button>
                <button class="option-btn" onclick="selectGender('female')">
                    <i class="fa-solid fa-venus"></i>Female
                </button>
            </div>
        </div>

        <div id="step-age" class="hidden">
            <div class="step-title"><i class="fa-solid fa-cake-candles"></i> Select Your Age Range</div>
            <div class="options-grid">
                <button class="option-btn" onclick="selectAge('10-15', event)">10-15</button>
                <button class="option-btn" onclick="selectAge('15-20', event)">15-20</button>
                <button class="option-btn" onclick="selectAge('20-25', event)">20-25</button>
                <button class="option-btn" onclick="selectAge('25-30', event)">25-30</button>
                <button class="option-btn" onclick="selectAge('30-35', event)">30-35</button>
                <button class="option-btn" onclick="selectAge('35-40', event)">35-40</button>
                <button class="option-btn" onclick="selectAge('40-45', event)">40-45</button>
                <button class="option-btn" onclick="selectAge('45-50', event)">45-50</button>
                <button class="option-btn" onclick="selectAge('50-55', event)">50-55</button>
                <button class="option-btn" onclick="selectAge('55-60', event)">55-60</button>
                <button class="option-btn" onclick="selectAge('60-65', event)">60-65</button>
                <button class="option-btn" onclick="selectAge('65-70', event)">65-70</button>
                <button class="option-btn" onclick="selectAge('70-75', event)">70-75</button>
                <button class="option-btn" onclick="selectAge('75-80', event)">75-80</button>
                <button class="option-btn" onclick="selectAge('80-85', event)">80-85</button>
                <button class="option-btn" onclick="selectAge('85-90', event)">85-90</button>
            </div>
        </div>

        <div id="step-environment" class="hidden">
            <div class="step-title"><i class="fa-solid fa-compass"></i> Select Atmosphere / Occasion</div>
            <div class="options-grid" id="env-buttons-container">
                </div>
        </div>

        <div id="result-section" class="hidden">
            <div class="step-title" style="color: var(--primary);"><i class="fa-solid fa-wand-magic-sparkles"></i> Recommendations For You</div>
            <div id="perfume-results"></div>
        </div>
    </div>

    <script>
        let selections = { gender: null, age: null, env: null };

        // %100 FARKLI VE ASLA ÇAKIŞMAYAN KADIN & ERKEK SEÇKİN VERİTABANI
        const database = {
            male: {
                young: { // 10-20 (Okul Çağı Erkek)
                    school: [{ brand: "Zara", name: "Seoul", desc: "A vibrant, sporty combination of tangerine and smooth marine accords. Perfect for active school days.", notes: ["Marine Notes", "Tangerine", "Amber"] }],
                    daily: [{ brand: "Nautica", name: "Voyage", desc: "A fresh burst of crunchy green apple and cool lotus. Famous for its casual, clean summer charm.", notes: ["Green Apple", "Water Lily", "Cedarwood"] }],
                    beach: [{ brand: "Zara", name: "Lisboa", desc: "Sparkling lemon juice and clean jasmine notes, bringing a cool breeze on a blazing hot day.", notes: ["Lemon", "Jasmine", "Musk"] }],
                    special: [{ brand: "Versace", name: "Eros EDT", desc: "A highly hypnotic mix of fresh mint, green apple, and rich Madagascar vanilla.", notes: ["Mint", "Green Apple", "Vanilla"] }]
                },
                college: { // 20-25 (Üniversite Çağı Erkek)
                    school: [{ brand: "YSL", name: "Y EDP", desc: "Clean, ultra-modern, and dynamic blend of sharp apple and refined sage. Lasts all day in lecture halls.", notes: ["Apple", "Sage", "Amberwood"] }],
                    work: [{ brand: "Prada", name: "L'Homme", desc: "The ultimate standard of neatness. Luxurious soapy freshness with elegant powdery iris.", notes: ["Iris", "Neroli", "Amber"] }],
                    daily: [{ brand: "Dior", name: "Sauvage EDT", desc: "A raw, charismatic combination of crisp Calabrian bergamot and fiery Sichuan pepper.", notes: ["Bergamot", "Sichuan Pepper", "Ambroxan"] }],
                    beach: [{ brand: "Kenzo", name: "Homme Intense", desc: "A magnificent tropical woody vibe layered with fresh sea salt and creamy fig pulp.", notes: ["Sea Salt", "Fig Tree", "Sandalwood"] }],
                    special: [{ brand: "Afnan", name: "9pm", desc: "An ultra-popular, long-lasting party specialist featuring juicy pear and sweet black vanilla.", notes: ["Pear", "Lavender", "Vanilla"] }]
                },
                adult: { // 25-50 (Yetişkin Erkek)
                    work: [{ brand: "Montblanc", name: "Explorer", desc: "A highly sophisticated business aroma displaying fresh bergamot and smooth premium leather.", notes: ["Bergamot", "Leather", "Patchouli"] }],
                    daily: [{ brand: "Creed", name: "Aventus", desc: "The unrivaled king of luxury. A stellar contrast of rich pineapple and deep, smoky birch woods.", notes: ["Pineapple", "Birch", "Patchouli", "Musk"] }],
                    beach: [{ brand: "Armani", name: "Acqua Di Gio Profondo", desc: "Deep ocean water energy infused with green mandarin and aromatic rosemary accents.", notes: ["Marine Notes", "Green Mandarin", "Mineral Accords"] }],
                    special: [{ brand: "Xerjoff", name: "Naxos", desc: "Pure prestige. An incredibly smooth and rich fusion of sweet honey, tobacco leaf, and vanilla.", notes: ["Honey", "Tobacco Leaf", "Vanilla"] }]
                },
                mature: { // 50-90 (Olgun Erkek)
                    work: [{ brand: "Terre d'Hermes", name: "Hermes EDT", desc: "A masterful corporate signature blending earthy flint stones with bitter orange peels.", notes: ["Orange", "Flint", "Vetiver", "Cedar"] }],
                    daily: [{ brand: "Guerlain", name: "Vetiver", desc: "The absolute standard of traditional masculine refinement. Crisp, woody, and entirely timeless.", notes: ["Vetiver", "Tobacco", "Bergamot"] }],
                    beach: [{ brand: "Davidoff", name: "Cool Water", desc: "A legendary vintage marine blast that mimics cold ocean waves and wild mint leaves.", notes: ["Sea Water", "Mint", "Lavender"] }],
                    special: [{ brand: "Roja Parfums", name: "Elysium Pour Homme", desc: "An ultra-premium masterpiece featuring sparkling grapefruit, deep ambergris, and soft leather.", notes: ["Grapefruit", "Ambergris", "Leather"] }]
                }
            },
            female: {
                young: { // 10-20 (Okul Çağı Kadın)
                    school: [{ brand: "Marc Jacobs", name: "Daisy", desc: "Sweet wild strawberries and soft violet petals. A wonderfully innocent and clean school scent.", notes: ["Strawberry", "Violet", "Gardenia"] }],
                    daily: [{ brand: "Zara", name: "Wonder Rose", desc: "A joyful, uplifting blend of sweet pear, red berries, and delicate vanilla sugar.", notes: ["Pear", "Red Berries", "Vanilla"] }],
                    beach: [{ brand: "Zara", name: "Orchid", desc: "Fresh orchid petals combined with bright bergamot, giving a sunny and airy vacation aura.", notes: ["Orchid", "Bergamot", "Peach"] }],
                    special: [{ brand: "Aquolina", name: "Pink Sugar", desc: "A wildly playful and nostalgic gourmand universe packed with spun cotton candy and caramel.", notes: ["Cotton Candy", "Caramel", "Strawberry"] }]
                },
                college: { // 20-25 (Üniversite Çağı Kadın)
                    school: [{ brand: "Chanel", name: "Chance Eau Tendre", desc: "An effortlessly elegant and crisp mixture of fresh quince fruit and powdery white jasmine blossoms.", notes: ["Quince", "Grapefruit", "Jasmine"] }],
                    work: [{ brand: "Lancome", name: "Idole", desc: "A flawless, crystal-clean presentation of morning roses layered over soft radiant white musk.", notes: ["Rose", "Pear", "White Musk"] }],
                    daily: [{ brand: "Ariana Grande", name: "Cloud", desc: "A delightfully airy and cozy cloud of whipped cream, sweet praline, and tropical coconut husk.", notes: ["Whipped Cream", "Coconut", "Praline"] }],
                    beach: [{ brand: "Sol de Janeiro", name: "Cheirosa 62", desc: "Irresistible Brazilian beach energy featuring warm toasted pistachio and luscious salted caramel.", notes: ["Pistachio", "Salted Caramel", "Vanilla"] }],
                    special: [{ brand: "Yves Saint Laurent", name: "Black Opium", desc: "A deeply seductive, dark evening fragrance celebrating roasted coffee beans, vanilla, and sweet pear.", notes: ["Coffee", "Vanilla", "Pear"] }]
                },
                adult: { // 25-50 (Yetişkin Kadın)
                    work: [{ brand: "Narciso Rodriguez", name: "For Her Pure Musc", desc: "An incredibly noble, clean musk that beautifully communicates modern business confidence and poise.", notes: ["Musk", "White Flowers", "Cashmeran"] }],
                    daily: [{ brand: "Chanel", name: "Coco Mademoiselle", desc: "A timeless, wealthy aura created by a luxurious harmony of bright orange and rich patchouli.", notes: ["Orange", "Patchouli", "Turkish Rose"] }],
                    beach: [{ brand: "Estee Lauder", name: "Bronze Goddess", desc: "A luxury resort masterpiece filled with creamy coconut milk, tiare flower, and golden amber warmth.", notes: ["Coconut", "Tiare Flower", "Amber"] }],
                    special: [{ brand: "Parfums de Marly", name: "Delina", desc: "The ultimate queen of modern niche. Heavenly Turkish rose petals mixed with exotic lychee fruit.", notes: ["Turkish Rose", "Lychee", "Rhubarb"] }]
                },
                mature: { // 50-90 (Olgun Kadın)
                    work: [{ brand: "Dior", name: "J'adore EDP", desc: "A glorious, majestic golden bouquet of exotic ylang-ylang, damask rose, and noble jasmine.", notes: ["Ylang-Ylang", "Damask Rose", "Jasmine"] }],
                    daily: [{ brand: "Hermes", name: "Eau des Merveilles", desc: "An enchanting, warm woody-amber whisper without dominant flowers. Captures pure artistic luxury.", notes: ["Ambergris", "Orange", "Elemi Resin"] }],
                    beach: [{ brand: "Tom Ford", name: "Soleil Blanc", desc: "High-end private island opulence blending sultry coco de mer with solar ylang-ylang notes.", notes: ["Coconut", "Ylang-Ylang", "Cardamom"] }],
                    special: [{ brand: "Maison Francis Kurkdjian", name: "Baccarat Rouge 540", desc: "A legendary, historic masterpiece showcasing sophisticated saffron threads and warm amberwood.", notes: ["Saffron", "Jasmine", "Amberwood"] }]
                }
            }
        };

        function selectGender(gender) {
            selections.gender = gender;
            const buttons = document.querySelectorAll('#step-gender .option-btn');
            buttons.forEach(btn => btn.classList.remove('active', 'female-active'));
            
            if (gender === 'female') {
                event.currentTarget.classList.add('active', 'female-active');
            } else {
                event.currentTarget.classList.add('active');
            }
            document.getElementById('step-age').classList.remove('hidden');
            resetFromStep('age');
        }

        function selectAge(age, e) {
            selections.age = age;
            const buttons = document.querySelectorAll('#step-age .option-btn');
            buttons.forEach(btn => btn.classList.remove('active', 'female-active'));
            
            if (selections.gender === 'female') {
                e.currentTarget.classList.add('active', 'female-active');
            } else {
                e.currentTarget.classList.add('active');
            }
            buildEnvironmentButtons(age);
            document.getElementById('step-environment').classList.remove('hidden');
            resetFromStep('env');
        }

        function buildEnvironmentButtons(age) {
            const container = document.getElementById('env-buttons-container');
            container.innerHTML = '';

            const allEnvs = {
                school: { text: "School", icon: "fa-solid fa-graduation-cap" },
                work: { text: "Work", icon: "fa-solid fa-briefcase" },
                daily: { text: "Daily", icon: "fa-solid fa-house-user" },
                beach: { text: "Beach / Coast", icon: "fa-solid fa-umbrella-beach" },
                special: { text: "Special Night", icon: "fa-solid fa-champagne-glasses" }
            };

            let activeEnvs = [];

            if (age === '10-15' || age === '15-20') {
                activeEnvs = ['school', 'daily', 'beach', 'special'];
            } else if (age === '20-25') {
                activeEnvs = ['school', 'work', 'daily', 'beach', 'special'];
            } else {
                activeEnvs = ['work', 'daily', 'beach', 'special'];
            }

            activeEnvs.forEach(envKey => {
                const envInfo = allEnvs[envKey];
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<i class="${envInfo.icon}"></i>${envInfo.text}`;
                btn.onclick = (e) => selectEnvironment(envKey, e);
                container.appendChild(btn);
            });
        }

        function selectEnvironment(env, e) {
            selections.env = env;
            const buttons = document.querySelectorAll('#step-environment .option-btn');
            buttons.forEach(btn => btn.classList.remove('active', 'female-active'));
            
            if (selections.gender === 'female') {
                e.currentTarget.classList.add('active', 'female-active');
            } else {
                e.currentTarget.classList.add('active');
            }
            showResults();
        }

        function showResults() {
            const resultSection = document.getElementById('result-section');
            const resultsContainer = document.getElementById('perfume-results');
            resultsContainer.innerHTML = '';

            let ageGroup = 'adult';
            if (selections.age === '10-15' || selections.age === '15-20') ageGroup = 'young';
            else if (selections.age === '20-25') ageGroup = 'college';
            else {
                let firstAge = parseInt(selections.age.split('-')[0]);
                if (firstAge >= 50) ageGroup = 'mature';
            }

            const perfumes = database[selections.gender]?.[ageGroup]?.[selections.env] || [];

            if (perfumes.length === 0) {
                resultsContainer.innerHTML = '<p style="color: #999;">No matching perfumes found.</p>';
            } else {
                perfumes.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'perfume-card';
                    if(selections.gender === 'female') {
                        card.style.borderLeftColor = '#d4a5b8';
                    }
                    let notesHtml = p.notes.map(n => `<span class="note-tag">${n}</span>`).join('');
                    card.innerHTML = `
                        <div class="perfume-brand">${p.brand}</div>
                        <div class="perfume-name">${p.name}</div>
                        <div class="perfume-desc">${p.desc}</div>
                        <div class="perfume-notes">${notesHtml}</div>
                    `;
                    resultsContainer.appendChild(card);
                });
            }
            resultSection.classList.remove('hidden');
            resultSection.scrollIntoView({ behavior: 'smooth' });
        }

        function resetFromStep(step) {
            if (step === 'age') {
                document.getElementById('step-environment').classList.add('hidden');
                selections.age = null; selections.env = null;
            }
            if (step === 'env') { selections.env = null; }
            document.getElementById('result-section').classList.add('hidden');
        }
    </script>
</body>
</html>

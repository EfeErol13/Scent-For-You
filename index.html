    <style>
        :root {
            --primary: #1a1a1a;
            --accent: #bda370;
            --bg: #f9f9f9;
            --card-bg: #ffffff;
            --text: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.03);
        }

        h1 {
            text-align: center;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 30px;
            color: var(--primary);
            text-transform: uppercase;
        }

        h1 span {
            color: var(--accent);
            font-weight: 600;
        }

        .step-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 12px;
            margin-bottom: 30px;
        }

        .option-btn {
            background: #fff;
            border: 2px solid #eee;
            padding: 15px 10px;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .option-btn i {
            display: block;
            font-size: 1.6rem;
            margin-bottom: 8px;
            color: #ccc;
            transition: color 0.3s ease;
        }

        .option-btn:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .option-btn.active {
            border-color: var(--primary);
            background: var(--primary);
            color: #fff;
        }

        .option-btn.active i {
            color: var(--accent);
        }

        .option-btn.active.female-active {
            border-color: #d4a5b8;
            background: #4a3740;
            color: #fff;
        }
        .option-btn.active.female-active i {
            color: #d4a5b8;
        }

        .hidden {
            display: none;
        }

        #result-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }

        .perfume-card {
            background: #fff;
            border: 1px solid #eee;
            border-left: 5px solid var(--accent);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .perfume-brand {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            font-weight: 600;
        }

        .perfume-name {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--primary);
            margin: 5px 0 10px 0;
        }

        .perfume-desc {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .perfume-notes {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .note-tag {
            background: #f0f0f0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #555;
        }

        @media (max-width: 600px) {
            .container { padding: 20px; margin: 10px auto; }
            .options-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>

            { gender: "female", group: "extra3", env: "special", brand: "Maison Francis Kurkdjian", name: "Baccarat Rouge 540", desc: "A legendary, historic masterpiece showcasing sophisticated saffron threads and warm amberwood.", notes: ["Saffron", "Jasmine", "Amberwood"] }
        ];

        function selectGender(gender, element) {
            selections.gender = gender;
            const buttons = document.querySelectorAll('#step-gender .option-btn');
            buttons.forEach(btn => btn.classList.remove('active', 'female-active'));
            
            if (gender === 'female') {
                element.classList.add('active', 'female-active');
            } else {
                element.classList.add('active');
            }
            document.getElementById('step-age').classList.remove('hidden');
            resetFromStep('age');
        }

        function selectAge(age, element) {
            selections.age = age;
            const buttons = document.querySelectorAll('#step-age .option-btn');
            buttons.forEach(btn => btn.classList.remove('active', 'female-active'));
            
            if (selections.gender === 'female') {
                element.classList.add('active', 'female-active');
            } else {
                element.classList.add('active');
            }
            buildEnvironmentButtons(age);
            document.getElementById('step-environment').classList.remove('hidden');
            resetFromStep('env');
        }

        function buildEnvironmentButtons(age) {
            const container = document.getElementById('env-buttons-container');
            container.innerHTML = '';

            const allEnvs = {
                school: { text: "School", icon: "fa-solid fa-graduation-cap" },
                work: { text: "Work", icon: "fa-solid fa-briefcase" },
                daily: { text: "Daily", icon: "fa-solid fa-house-user" },
                beach: { text: "Beach / Coast", icon: "fa-solid fa-umbrella-beach" },
                special: { text: "Special Night", icon: "fa-solid fa-champagne-glasses" }
            };

            let activeEnvs = [];
            let startAge = parseInt(age.split('-')[0]);

            if (startAge < 20) {
                activeEnvs = ['school', 'daily', 'beach', 'special'];
            } else if (startAge === 20) {
                activeEnvs = ['school', 'work', 'daily', 'beach', 'special'];
            } else {
                activeEnvs = ['work', 'daily', 'beach', 'special'];
            }

            activeEnvs.forEach(envKey => {
                const envInfo = allEnvs[envKey];
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<i class="${envInfo.icon}"></i>${envInfo.text}`;
                btn.onclick = function() { selectEnvironment(envKey, this); };
                container.appendChild(btn);
            });
        }

        function selectEnvironment(env, element) {
            selections.env = env;
            const buttons = document.querySelectorAll('#step-environment .option-btn');
            buttons.forEach(btn => btn.classList.remove('active', 'female-active'));
            
            if (selections.gender === 'female') {
                element.classList.add('active', 'female-active');
            } else {
                element.classList.add('active');
            }
            showResults();
        }

        function showResults() {
            const resultSection = document.getElementById('result-section');
            const resultsContainer = document.getElementById('perfume-results');
            resultsContainer.innerHTML = '';

            let startAge = parseInt(selections.age.split('-')[0]);
            let mappedGroup = "teen";

            if (startAge >= 10 && startAge < 20) mappedGroup = "teen";
            else if (startAge >= 20 && startAge < 25) mappedGroup = "young";
            else if (startAge >= 25 && startAge < 30) mappedGroup = "extra4";
            else if (startAge >= 30 && startAge < 35) mappedGroup = "mid";
            else if (startAge >= 35 && startAge < 40) mappedGroup = "senior";
            else if (startAge >= 40 && startAge < 45) mappedGroup = "mature";
            else if (startAge >= 45 && startAge < 50) mappedGroup = "extra1";
            else if (startAge >= 50 && startAge < 60) mappedGroup = "extra2";
            else if (startAge >= 60) mappedGroup = "extra3";

            let match = perfumePool.find(p => p.gender === selections.gender && p.group === mappedGroup && p.env === selections.env);

            if (!match) {
                match = perfumePool.find(p => p.gender === selections.gender && p.env === selections.env);
            }

            if (!match) {
                match = perfumePool.find(p => p.gender === selections.gender);
            }

            const card = document.createElement('div');
            card.className = 'perfume-card';
            if(selections.gender === 'female') {
                card.style.borderLeftColor = '#d4a5b8';
            }
            let notesHtml = match.notes.map(n => `<span class="note-tag">${n}</span>`).join('');
            card.innerHTML = `
                <div class="perfume-brand">${match.brand}</div>
                <div class="perfume-name">${match.name}</div>
                <div class="perfume-desc">${match.desc}</div>
                <div class="perfume-notes">${notesHtml}</div>
            `;
            resultsContainer.appendChild(card);
            
            resultSection.classList.remove('hidden');
            resultSection.scrollIntoView({ behavior: 'smooth' });
        }

        function resetFromStep(step) {
            if (step === 'age') {
                document.getElementById('step-environment').classList.add('hidden');
                selections.age = null; selections.env = null;
            }
            if (step === 'env') { selections.env = null; }
            document.getElementById('result-section').classList.add('hidden');
        }
    </script>
</body>
</html>
